name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every version in peerDependencies must be covered here, and nothing else.
      matrix:
        include:
          - node: 22
            nest: 11
          - node: 24 # NestJS 12 is ESM-only: Jest needs Node 24.9+ to require() it
            nest: 12

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rowguard_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # devDependencies pin the newest NestJS; swap in the older major for its job.
      - name: Use NestJS ${{ matrix.nest }}
        if: matrix.nest != 12
        run: >-
          npm install --no-save
          @nestjs/common@^${{ matrix.nest }}
          @nestjs/core@^${{ matrix.nest }}
          @nestjs/testing@^${{ matrix.nest }}
          @nestjs/platform-express@^${{ matrix.nest }}

      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test

      # The published artifact (build, pack, install, require/import/types). Once is enough.
      - name: Pack smoke test
        if: matrix.node == 24
        run: npm run test:pack
