services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rowguard_test
    ports:
      - "54329:5432" # non-default host port to avoid clashing with a local Postgres
    # Lets `docker compose up --wait` block until Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rowguard_test"]
      interval: 1s
      timeout: 3s
      retries: 30
